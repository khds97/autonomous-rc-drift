<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">Autonomous RC Drift Car — ROS 2 Foxy System Architecture</title>
<desc id="desc">Distributed Raspberry Pi sensing, laptop DAgger and OpenVINS processing, and STM32 RC transmitter interface.</desc>
<defs>
  <style>
    text{font-family:Arial,'Noto Sans',sans-serif;fill:#172033}
    .heading{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#64748b}
    .device{fill:#f8fafc;stroke:#64748b;stroke-width:2.5}
    .device-title{font-size:26px;font-weight:700}
    .panel-title{font-size:20px;font-weight:700}
    .node-title{font-size:18px;font-weight:700}
    .body{font-size:16px}.small{font-size:14px;fill:#526078}
    .muted{fill:#64748b}
    .blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
    .green{fill:#ecfdf5;stroke:#34a879;stroke-width:2}
    .purple{fill:#f5f3ff;stroke:#9580d1;stroke-width:2}
    .orange{fill:#fff7ed;stroke:#e5a04d;stroke-width:2}
    .node{fill:#fff;stroke:#a8b4c4;stroke-width:1.6}
    .arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    .arrow-blue{fill:none;stroke:#3979b9;stroke-width:3;marker-end:url(#arrow-blue)}
    .arrow-green{fill:none;stroke:#26865c;stroke-width:3;marker-end:url(#arrow-green)}
    .arrow-orange{fill:none;stroke:#c47a2c;stroke-width:3;marker-end:url(#arrow-orange)}
    .dashed{stroke-dasharray:9 7}
    .tag{font-size:14px;font-weight:700;fill:#334155}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3979b9"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#26865c"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c47a2c"/></marker>
</defs>

<rect width="1800" height="1120" fill="#ffffff"/>
<text x="900" y="55" text-anchor="middle" class="heading">Autonomous RC Drift Car — ROS 2 Foxy System Architecture</text>
<text x="900" y="87" text-anchor="middle" class="subtitle">Distributed vehicle sensing · camera/IMU acquisition · DAgger · visual-inertial odometry · RC interface</text>

<!-- Raspberry Pi device -->
<rect x="45" y="135" width="540" height="805" rx="22" class="device"/>
<text x="315" y="180" text-anchor="middle" class="device-title">Raspberry Pi 4</text>
<text x="315" y="207" text-anchor="middle" class="small">Ubuntu 20.04 · ROS 2 Foxy</text>

<rect x="78" y="240" width="474" height="285" rx="16" class="blue"/>
<text x="315" y="275" text-anchor="middle" class="panel-title">Vehicle sensor path</text>
<rect x="112" y="300" width="406" height="76" rx="10" class="node"/>
<text x="315" y="330" text-anchor="middle" class="node-title">Vehicle sensors</text>
<text x="315" y="354" text-anchor="middle" class="small">Wheel Hall sensors · motor encoder · PWM · ADS1115</text>
<path d="M315 376 V405" class="arrow-blue"/>
<rect x="112" y="410" width="406" height="75" rx="10" class="node"/>
<text x="315" y="441" text-anchor="middle" class="node-title">driftmodel node</text>
<text x="315" y="465" text-anchor="middle" class="small">Vehicle telemetry → ROS 2 topics</text>
<text x="315" y="507" text-anchor="middle" class="tag">Existing vehicle-state pipeline</text>

<rect x="78" y="555" width="474" height="345" rx="16" class="green"/>
<text x="315" y="590" text-anchor="middle" class="panel-title">Camera / IMU acquisition path</text>
<rect x="112" y="615" width="406" height="105" rx="10" class="node"/>
<text x="315" y="646" text-anchor="middle" class="node-title">Sensor hardware</text>
<text x="315" y="673" text-anchor="middle" class="body">Fixed camera · Steering-linked rotating camera</text>
<text x="315" y="698" text-anchor="middle" class="body">ISM330DHCX 6-axis IMU</text>
<path d="M315 720 V750" class="arrow-green"/>
<rect x="112" y="755" width="406" height="92" rx="10" class="node"/>
<text x="315" y="788" text-anchor="middle" class="node-title">sensor_publisher</text>
<text x="315" y="814" text-anchor="middle" class="small">image_transport · GPIO data-ready · I²C</text>
<text x="315" y="875" text-anchor="middle" class="tag">Camera: base image topics + compressed transport</text>

<!-- Laptop -->
<rect x="650" y="135" width="650" height="805" rx="22" class="device"/>
<text x="975" y="180" text-anchor="middle" class="device-title">Laptop</text>
<text x="975" y="207" text-anchor="middle" class="small">Ubuntu · ROS 2 Foxy</text>

<rect x="685" y="240" width="580" height="300" rx="16" class="blue"/>
<text x="975" y="275" text-anchor="middle" class="panel-title">DAgger / vehicle control software</text>
<rect x="720" y="300" width="510" height="62" rx="10" class="node"/>
<text x="975" y="337" text-anchor="middle" class="node-title">sync_sub</text>
<path d="M975 362 V385" class="arrow-blue"/>
<rect x="720" y="390" width="510" height="62" rx="10" class="node"/>
<text x="975" y="427" text-anchor="middle" class="node-title">preprocess → model inference</text>
<path d="M975 452 V475" class="arrow-blue"/>
<rect x="720" y="480" width="510" height="42" rx="10" class="node"/>
<text x="975" y="507" text-anchor="middle" class="node-title">driftmodel_env / DAgger</text>

<rect x="685" y="570" width="580" height="145" rx="16" class="purple"/>
<text x="975" y="605" text-anchor="middle" class="panel-title">OpenVINS — separate VIO pipeline</text>
<rect x="720" y="625" width="510" height="62" rx="10" class="node"/>
<text x="975" y="651" text-anchor="middle" class="node-title">Modified compressed-image subscriber</text>
<text x="975" y="674" text-anchor="middle" class="small">Compressed camera streams + /imu/data_raw</text>

<rect x="685" y="745" width="580" height="145" rx="16" class="green"/>
<text x="975" y="780" text-anchor="middle" class="panel-title">Data recording and offline analysis</text>
<rect x="720" y="800" width="510" height="62" rx="10" class="node"/>
<text x="975" y="826" text-anchor="middle" class="node-title">rosbag recording</text>
<text x="975" y="849" text-anchor="middle" class="small">Compressed camera topics · /imu/data_raw · vehicle topics as needed</text>

<!-- STM32 -->
<rect x="1360" y="240" width="395" height="535" rx="22" class="device"/>
<text x="1557" y="285" text-anchor="middle" class="device-title">STM32F401CCU6</text>
<text x="1557" y="312" text-anchor="middle" class="small">RC transmitter signal interface</text>
<rect x="1395" y="350" width="325" height="355" rx="16" class="orange"/>
<rect x="1430" y="385" width="255" height="76" rx="10" class="node"/>
<text x="1557" y="416" text-anchor="middle" class="node-title">USB CDC serial</text>
<text x="1557" y="440" text-anchor="middle" class="small">Laptop command / telemetry</text>
<path d="M1557 461 V490" class="arrow-orange"/>
<rect x="1430" y="495" width="255" height="72" rx="10" class="node"/>
<text x="1557" y="524" text-anchor="middle" class="node-title">ADC</text>
<text x="1557" y="548" text-anchor="middle" class="small">Read transmitter signals</text>
<path d="M1557 567 V596" class="arrow-orange"/>
<rect x="1430" y="601" width="255" height="72" rx="10" class="node"/>
<text x="1557" y="630" text-anchor="middle" class="node-title">MCP4725 DAC × 2</text>
<text x="1557" y="654" text-anchor="middle" class="small">Analog steering / throttle output</text>
<text x="1557" y="691" text-anchor="middle" class="small">GPIO selects manual / laptop mode</text>

<rect x="1400" y="825" width="320" height="75" rx="14" class="orange"/>
<text x="1560" y="855" text-anchor="middle" class="node-title">RC transmitter</text>
<text x="1560" y="879" text-anchor="middle" class="small">Steering / throttle signal interface</text>
<path d="M1557 705 V825" class="arrow-orange"/>

<!-- Inter-device data links -->
<path d="M518 447 H615 V331 H720" class="arrow-blue"/>
<text x="620" y="308" text-anchor="middle" class="small">ROS 2 DDS</text>
<path d="M518 800 H615 V655 H720" class="arrow-green"/>
<path d="M615 800 V831 H720" class="arrow-green"/>
<text x="622" y="625" text-anchor="middle" class="small">ROS 2 DDS</text>
<text x="622" y="855" text-anchor="middle" class="small">ROS 2 DDS</text>

<path d="M1230 500 H1330 V423 H1430" class="arrow-orange"/>
<text x="1320" y="398" text-anchor="middle" class="small">USB CDC</text>
<path d="M1430 535 H1330 V535 H1230" class="arrow-orange dashed"/>
<text x="1320" y="560" text-anchor="middle" class="small">Telemetry</text>

<!-- Network / scope notes -->
<rect x="45" y="975" width="1710" height="105" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="78" y="1013" class="panel-title">Architecture notes</text>
<text x="310" y="1012" class="body">• Vehicle-state and camera/IMU acquisition are separate ROS 2 paths on the Raspberry Pi.</text>
<text x="310" y="1042" class="body">• OpenVINS and rosbag consume camera/IMU data independently of the existing DAgger control pipeline.</text>
<text x="310" y="1070" class="small">STM32 is a USB-connected hardware interface, not a ROS 2 node. End-to-end vehicle integration has not yet been validated.</text>
</svg>